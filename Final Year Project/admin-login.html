<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Review Detector | Admin Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">ReviewGuard AI</a>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="review.html">Check Review</a></li>
                <li><a href="history.html">History</a></li>
                <li><a href="admin-login.html" class="active">Admin</a></li>
                <li><a href="login.html" class="btn btn-outline" style="padding: 8px 20px;">Login</a></li>
                <li><a href="register.html" class="btn btn-primary" style="padding: 8px 20px;">Register</a></li>
            </ul>
        </nav>
    </header>

    <main style="justify-content: center; align-items: center; min-height: calc(100vh - 80px);">
        <div class="glass-panel animate-up" style="width: 100%; max-width: 450px; padding: 40px; text-align: center;">
            <h2 style="margin-bottom: 5px;">Admin Gateway</h2>
            <p style="margin-bottom: 30px; font-size: 0.95rem; color: var(--danger-color);">Restricted Access Only</p>
            
            <form id="adminLoginForm">
                <div class="form-group">
                    <label for="adminUsername">Username</label>
                    <input type="text" id="adminUsername" placeholder="Enter admin username" required>
                </div>
                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <input type="password" id="adminPassword" placeholder="••••••••" required>
                </div>
                <div id="adminLoginError" style="color: var(--danger-color); font-size: 0.85rem; margin-bottom: 10px; display: none;">Invalid credentials</div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px; background: linear-gradient(135deg, #ff4b4b, #ff7e7e); border: none; font-weight: 600;">Secure Login</button>
            </form>
            
            <p style="margin-top: 25px; font-size: 0.85rem; color: var(--text-muted);">
                Authorized personnel only. All attempts are logged.
            </p>
        </div>
    </main>

    <footer>
        <p>&copy; nitesh kumar yadav</p>
        <p style="margin-top: 5px; font-size: 0.85rem; color: var(--primary-color);">MCA Final Year Project</p>
    </footer>

    <script src="js/script.js"></script>
    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('adminUsername').value;
            const pass = document.getElementById('adminPassword').value;
            
            // Hardcoded credentials for testing/demonstration
            if (user === 'admin' && pass === 'admin123') {
                document.getElementById('adminLoginError').style.display = 'none';
                window.location.href = 'admin.html';
            } else {
                document.getElementById('adminLoginError').style.display = 'block';
                document.getElementById('adminPassword').value = '';
            }
        });
    </script>
</body>
</html>
