<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Review Detector | Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">ReviewGuard AI</a>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="review.html">Check Review</a></li>
                <li><a href="history.html">History</a></li>
                <li><a href="login.html" class="btn btn-outline" style="padding: 8px 20px;">Login</a></li>
                <li><a href="register.html" class="btn btn-primary active" style="padding: 8px 20px;">Register</a></li>
            </ul>
        </nav>
    </header>

    <main style="justify-content: center; align-items: center; min-height: calc(100vh - 80px); padding-top: 20px; padding-bottom: 20px;">
        <div class="glass-panel animate-up" style="width: 100%; max-width: 500px; padding: 40px; text-align: center;">
            <h2 style="margin-bottom: 5px;">Create an Account</h2>
            <p style="margin-bottom: 30px; font-size: 0.95rem;">Join ReviewGuard AI today</p>
            
            <form id="registerForm">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Register Account</button>
            </form>
            
            <p style="margin-top: 25px; font-size: 0.95rem; color: var(--text-muted);">
                Already have an account? <a href="login.html" style="color: var(--primary-color); text-decoration: none; font-weight: 500;">Log in</a>
            </p>
        </div>
    </main>

    <footer>
        <p>&copy; nitesh kumar yadav</p>
        <p style="margin-top: 5px; font-size: 0.85rem; color: var(--primary-color);">MCA Final Year Project</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
